{"name": "Sync regulatory data", "on": {"schedule": [{"cron": "17 2 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "concurrency": {"group": "sync", "cancel-in-progress": false}, "jobs": {"sync": {"runs-on": "ubuntu-latest", "timeout-minutes": 150, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "pip install pdfplumber"}, {"run": "python sync_data.py"}, {"uses": "actions/setup-node@v4", "with": {"node-version": "22"}}, {"name": "Build search-engine pages", "run": "node build_pages.mjs", "continue-on-error": true}, {"run": "git config user.name 'creambiomed-data-bot'\ngit config user.email 'actions@users.noreply.github.com'\ngit add -A\ngit diff --cached --quiet || git commit -q -m 'Update regulatory data and pages'\ngit pull --rebase origin main\ngit push"}]}}}